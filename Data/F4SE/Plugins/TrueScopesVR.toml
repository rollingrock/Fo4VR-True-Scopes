# FO4VR True Scopes settings

[TrueScopesVR]
# Master switch for the lens fill.
fillEnabled = true

# Lens refresh cadence: 1 = every frame, 2 = every other frame, ...
# The lens render target persists between fills, so higher values just lower the
# refresh rate of the scope picture. 2 is the recommended default: at 1 the scope
# render can produce intermittent black lens frames in busy scenes (per-frame
# engine resource contention — under investigation).
fillEveryNFrames = 1

# What fills the lens: 1 = copy of the main frame (phase-1 placeholder),
# 2 = real magnified world render from the scope camera (falls back to 1 on failure).
# Diagnostics (raw, untonemapped): 3 = diffuse G-buffer, 4 = light accum diffuse,
# 5 = light accum specular, 6 = G-buffer normals. 4 vs 2 bisects the sun overbright:
# if 4 is also blown flat, the sun pass writes garbage; if 4 looks sane, the
# composite consumption is at fault.
lensMode = 2

# Scope render field of view in degrees (lower = more zoom). Fixed for now; will be
# driven by the weapon's zoom data later.
scopeFovDegrees = 15.0

# Scope camera frustum near/far planes. near must be < far (near==far is a NaN
# projection and a black lens). 15 = engine default near.
scopeNearClip = 15.0
scopeFarClip = 250000.0

# Scope camera position in weapon-local space — push it to the objective (front) end
# of the scope tube. Y = forward along the barrel. This file reloads on every scope-in,
# so tune these live: edit, save, lower and re-raise the scope.
scopeCamOffsetX = 0.0
scopeCamOffsetY = 15.0
scopeCamOffsetZ = 0.0

# Draw the sun (directional light) into the scope render (v0.2.26). Off = the
# v0.2.25 look: ambient + local lights only.
sunEnabled = true

# Scale on the sun's color in the scope render only (1.0 = engine value). Lower it
# live if the lens looks blown out.
sunBrightnessScale = 1.0

# Sun specular into the accum (currently broken constants — off = sun is diffuse
# only, which looks correct minus highlights; on = re-test after fixes).
sunSpecEnabled = false

# Tone bisect (v0.2.36): the scope's ambient base level. The light accumulation is
# pre-cleared to the world fog color (scaled by accumClearScale) with accumClearAlpha
# in the alpha channel. The lens currently reads paler/washed vs the world; tune live:
#   accumClearScale 1.0 = current look, 0.0 = the too-dark v0.2.27 look, try 0.5
#   accumClearAlpha 1.0 = current; try 0.0 (alpha may be a light-mask the composite reads)
accumClearScale = 1.0
accumClearAlpha = 1.0

# Draw the sky in the lens (v0.2.36). Off = sky regions stay black (the old look).
skyEnabled = true

# Which sky roots feed the lens sky: 1 = sky dome only, 2 = sun/clouds only, 3 = both.
# If the render faults at "sky draw", bisect with 1 (the sun/cloud root is the suspect).
skyRootMask = 3

# After a render fault, re-attempt on the next scope-in instead of staying on the
# copy-fill fallback for the whole session. Each fault is logged with its step.
retryAfterFault = true

# Force iScopeEnabled:VR to 2 (always-on) after game load. Optional — the vanilla
# default (1, eye-gated) shows the scope only while aiming down it.
forceAlwaysOn = false

# Suppress the vanilla scope-in world blackout (imagespace modifier). Core to seeing
# world + scope at the same time.
disableScopeBlackout = true

# Also suppress the eye-approach dimming fade (leave false for the vanilla feel).
disableApproachFade = false

# Black-burst hunt (v0.2.43): per-frame 1-pixel readback of accum+composite, dark
# frames logged. Two GPU sync stalls per render - turn OFF when not hunting.
diagLensReadback = false

# Burst forensics (v0.2.45): tint non-filled frames - RED = eye-gate pause,
# GREEN = cadence skip. A colored "burst" means the burst is a non-filled frame.
diagPauseTint = false
