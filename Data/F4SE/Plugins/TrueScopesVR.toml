# FO4VR True Scopes settings

[TrueScopesVR]
# Master switch for the lens fill.
fillEnabled = true

# Lens refresh cadence: 1 = every frame, 2 = every other frame, ...
# The lens render target persists between fills, so higher values just lower the
# refresh rate of the scope picture.
fillEveryNFrames = 1

# What fills the lens: 1 = copy of the main frame (phase-1 placeholder),
# 2 = real magnified world render from the scope camera (falls back to 1 on failure).
lensMode = 3

# Scope render field of view in degrees (lower = more zoom). Fixed for now; will be
# driven by the weapon's zoom data later.
scopeFovDegrees = 15.0

# Scope camera position in weapon-local space — push it to the objective (front) end
# of the scope tube. Y = forward along the barrel. This file reloads on every scope-in,
# so tune these live: edit, save, lower and re-raise the scope.
scopeCamOffsetX = 0.0
scopeCamOffsetY = 15.0
scopeCamOffsetZ = 0.0

# Force iScopeEnabled:VR to 2 (always-on) after game load. Optional — the vanilla
# default (1, eye-gated) shows the scope only while aiming down it.
forceAlwaysOn = false

# Suppress the vanilla scope-in world blackout (imagespace modifier). Core to seeing
# world + scope at the same time.
disableScopeBlackout = true

# Also suppress the eye-approach dimming fade (leave false for the vanilla feel).
disableApproachFade = false
