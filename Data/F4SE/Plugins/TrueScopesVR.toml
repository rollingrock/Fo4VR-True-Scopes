# FO4VR True Scopes settings

[TrueScopesVR]
# Master switch for the lens fill.
fillEnabled = true

# Lens refresh cadence: 1 = every frame, 2 = every other frame, ...
# The lens render target persists between fills, so higher values just lower the
# refresh rate of the scope picture. 2 is the recommended default: at 1 the scope
# render can produce intermittent black lens frames in busy scenes (per-frame
# engine resource contention — under investigation).
fillEveryNFrames = 1

# What fills the lens: 1 = copy of the main frame (phase-1 placeholder),
# 2 = real magnified world render from the scope camera (falls back to 1 on failure).
# Diagnostics (raw, untonemapped): 3 = diffuse G-buffer, 4 = light accum diffuse,
# 5 = light accum specular, 6 = G-buffer normals. 4 vs 2 bisects the sun overbright:
# if 4 is also blown flat, the sun pass writes garbage; if 4 looks sane, the
# composite consumption is at fault.
lensMode = 2

# Scope render field of view in degrees (lower = more zoom). Fixed for now; will be
# driven by the weapon's zoom data later.
# 0 = derive from the weapon's own magnification (see Settings.h); any positive
# value overrides it.
#
# VR-CONFIRMED 2026-08-10 on the hunting rifle's 6x long scope: derived reads
# 1.53-1.60 deg against the old hand-tuned 2.40. User verdict: "it's more
# magnified, looked fine", no visible breathing as the field tracks head
# distance. The old 2.4 was showing about 4.2x on a scope that claims 6x --
# tuned to look good rather than to be faithful, which is why the two numbers
# were never going to agree.
scopeFovDegrees = 0.0

# Scope camera frustum near/far planes. near must be < far (near==far is a NaN
# projection and a black lens). 15 = engine default near.
scopeNearClip = 15.0
scopeFarClip = 250000.0

# Scope camera position in weapon-local space — push it to the objective (front) end
# of the scope tube. Y = forward along the barrel. This file reloads on every scope-in,
# so tune these live: edit, save, lower and re-raise the scope.
scopeCamOffsetX = 0.0
scopeCamOffsetY = 55.0
scopeCamOffsetZ = 0.0

# Draw the sun (directional light) into the scope render (v0.2.26). Off = the
# v0.2.25 look: ambient + local lights only.
sunEnabled = true

# Scale on the sun's color in the scope render only (1.0 = engine value). Lower it
# live if the lens looks blown out.
sunBrightnessScale = 1.0

# Sun specular into the accum (currently broken constants — off = sun is diffuse
# only, which looks correct minus highlights; on = re-test after fixes).
sunSpecEnabled = false

# LENS BRIGHTNESS (ambient fill) -- a knob you are MEANT to touch.
# Flat fog-coloured fill added to the lens lighting before the sun and local lights.
# Higher = brighter, flatter, more washed out. Lower = deeper contrast, darker shadows.
#   0.04  default -- bisected in VR against the unscoped world on 2026-08-10
#         (0.00 read slightly dark, 0.08 slightly bright, so the match is between)
#   0.30  noticeably lifted
#   1.00  blown out. This was the value before v0.2.83, from when the fill was
#         standing in for a sun that contributed nothing.
# WARNING: coupled to sunExecEnabled below. A low value with the sun OFF is a
# near-black lens -- the fill was always a SUBSTITUTE for the missing sun.
accumClearScale = 0.04
accumClearAlpha = 1.0

# Draw the sky in the lens (v0.2.36). Off = sky regions stay black (the old look).
skyEnabled = true

# Which sky roots feed the lens sky: 1 = sky dome only, 2 = sun/clouds only, 3 = both.
# If the render faults at "sky draw", bisect with 1 (the sun/cloud root is the suspect).
skyRootMask = 3

# After a render fault, re-attempt on the next scope-in instead of staying on the
# copy-fill fallback for the whole session. Each fault is logged with its step.
retryAfterFault = true

# Force iScopeEnabled:VR to 2 (always-on) after game load. Optional — the vanilla
# default (1, eye-gated) shows the scope only while aiming down it.
forceAlwaysOn = false

# Suppress the vanilla scope-in world blackout (imagespace modifier). Core to seeing
# world + scope at the same time.
suppressScopeImods = true # v0.2.111: fullscreen zoom imods off; NV/recon looks are recreated in-lens

# --- glass effects (v0.2.113) — optical tubes only; screens (recon/thermal) skip them
# Eye-box / exit pupil: the picture clips and dims as your head drifts off the tube
# axis, from the real head-to-scope pose. The signature "real scope" feel.
# strength 0..1 (0 = off); gain = how strongly head movement moves the shadow
# (raise for a twitchier, less forgiving scope; lower if it feels too strict).
# strength 1.0 = shadow goes fully black (a real scope shadow is); lower for a
# deliberately see-through shadow. The eye-box follows whichever EYE is closer
# to the tube axis (the camera sits between your eyes), using eyeBoxIpdUnits
# (game units; 64 mm ~ 4.5) to find them.
eyeBoxStrength = 1.0
# 0.9 since 2026-08-24: 1.5 made the arm's-length sweet spot twitchy (hand
# jitter is magnified at distance). Raise it back for a stricter scope.
eyeBoxGain = 0.9
eyeBoxIpdUnits = 4.5
# Edge blur: field-curvature softness from edgeBlurStart (0..1 of the disc radius)
# out to the rim. strength 0 = off.
edgeBlurStrength = 0.35
edgeBlurStart = 0.7
# Chromatic fringe at the rim (red/blue focal split), 0..1. 0 = off.
caStrength = 0.35
# Night-vision phosphor scanlines, 0..1. Judged in VR at 0.8; 0 = clean NV.
nvScanlines = 0.8

# ============ THE GLASS SUITE (v0.2.123 - encapsulation polish) ============
# Field feedback 2026-08-24: "the render feels apart from the scope mesh...
# encapsulate it... glassy lens overlay". Three effects, all live-tunable and
# all exact no-ops at 0. NOT yet judged in the headset - tune freely.

# HOUSING RIM SHADOW - a hard near-black ring at the disc edge that reads as
# the ocular tube WALL (the soft vignette above stays photographic). Optical
# tubes only. Band runs rimShadowStart..rimShadowEnd in disc units (1.0 =
# picture edge); topBias drops the shadow center so the tube interior reads
# lit-from-above (rides the disc, so it cants with the gun); parallax shifts
# the ring opposite the eye - the rim is NEAR geometry against the far image.
rimShadowStrength = 0.9
rimShadowStart = 0.86
rimShadowEnd = 1.0
rimShadowTopBias = 0.05
rimShadowParallax = 0.2

# Under-aperture sizing: the picture disc sits this fraction of the housing
# hole so no bright pixel touches the seam. 1.0 = exact fit (old behavior).
widgetApertureScale = 0.97

# GLASS SHEEN - additive light on the eyepiece surface, in front of picture
# and reticle. A broad glint that slides opposite head motion (sheenTravel),
# a faint fresnel rim lift that grows off-axis, and a fixed smudge pattern
# that only shows where the glint rakes it (smudge CARVES the glint, never
# brightens). Applies to screen optics too - their front window is glass.
# Tuning tip: set sheenStrength 0.3 to place travel/width, then walk down.
sheenStrength = 0.06
sheenWidth = 0.55
sheenTravel = 0.9
sheenFresnel = 0.04
sheenSmudge = 0.35
sheenSmudgeScale = 9.0
# Dark-adaptive glass (v0.2.126): sheen term multiplied by up to (1+this) as
# the picture darkens - a black (eye-box-clipped / frozen) lens keeps glass
# surface life instead of reading as a dead screen. 0 = off. Tune 0-6.
sheenDarkBoost = 3.0
# Real-scope observation 2026-08-25: the reticle stays faintly visible inside
# the blacked-out eye box. 1 = reticle clips with the picture (old behavior),
# 0 = always visible; the picture always clips fully either way.
reticleEyeBoxFollow = 0.35
# The eye-box black bottoms out at this flat scatter level. NIGHT-TUNED
# 2026-08-26: 0.0 accepted in the headset (any floor glowed at night) and the
# daytime reticle-in-black spot-check PASSED at 0 - which contradicts the
# 2026-08-25 "0 = reticle invisible" lesson; both results are field-real, the
# newer targeted check ships. Re-check once in the v0.3 regression pass.
eyeBoxResidual = 0.0
# The scatter adapts to scene brightness (avg picture luminance x this,
# saturated). INERT at residual 0 (it scales the floor); 20.0 is the value
# accepted in the same 2026-08-26 ladder, kept faithful to the session.
eyeBoxResidualAdapt = 20.0

# Scene parity (v0.2.132): draw placed/geometry decals (grime, posters -
# accumulator group 5) AFTER the opaque walls in our resolve, instead of the
# engine's order which paints walls over them in a resolve-only render.
decalGroup5Reorder = true
# Bullet holes in the lens (v0.2.133) - KNOWN-FAULTING, leave OFF. The first
# field run faulted mid-stage and (pre-.134) orphaned the engine's decal lock,
# freezing the game on the next shot. v0.2.134 makes a fault harmless (the
# lock always releases; the stage self-disables with a step-numbered warn) but
# the root cause is not yet fixed. Enable only for a controlled diagnosis run.
decalStageEnabled = false
# Hardening: drop group 0x17 (sun glare) from our render - same stale-pass
# class as the v0.2.11 fault.
dropSunGlareGroup = true

# PARALLAX DEPTH - the picture shifts against the eye so the image plane
# reads parallaxDepthUnits game-units BEHIND the lens (1 unit ~ 1.43 cm; the
# classic looking-through-a-tube depth cue). Uses live eye relief, so a
# pistol at arm's length naturally shows less than a shouldered rifle.
# Sweep 0/3/6/10 live to taste; 0 = off. reticleParallaxFraction 0 keeps the
# reticle rim-anchored; 1 moves it WITH the image - which is what a real scope
# parallax-adjusted at distance does (image and reticle planes coincide).
# REAL-SCOPE COMPARISON PENDING (2026-08-25): A/B this with /config/set.
# Real-scope verdict 2026-08-25: "way more" - the image through a scope sits
# near optical infinity, so the factor should approach 1. Sweep 10/20/40.
parallaxDepthUnits = 20.0
# Raised with the depth bump; if a dark smear band appears at the shifted
# edge while swaying hard, lower this first.
parallaxMaxShift = 0.15
parallaxSmoothing = 0.3
parallaxMinEyeRelief = 4.0
# Real-scope verdict 2026-08-25: reticle moves 1:1 with the image.
reticleParallaxFraction = 1.0

# ONE EURO CAMERA DAMPING (v0.2.124) - kills magnified hand tremor without
# lagging deliberate pans (speed-adaptive). Filters ONLY the scope render
# camera's orientation; hands/weapon/reticle relationships stay honest, and
# the filtered-vs-true divergence is hard-capped at camSmoothMaxLagDegrees
# (converges to zero at rest - precision shots see the true pose).
# Code default is OFF; enabled here for the field-judgment session.
# TUNING LADDER (DevBench, no rebuild): 1) camSmoothBeta=0, raise
# camSmoothMinCutoffHz from 0.5 until at-rest tremor is gone (expect
# 0.8-1.5). 2) raise camSmoothBeta from 0.1 until pans track without slew.
# 3) snap-turn/teleport must adopt instantly (camSmoothSnapDegrees).
# NOTE: right after a snap turn smoothing is briefly reduced (the filter
# seeds its speed estimate from the jump) - expected, not a bug.
# Field 2026-08-25: no visible difference at this tuning, and the right shape
# may be FRIK-side hand dampening instead - OFF pending more testing. The
# knobs stay live for DevBench A/B (see the tuning ladder above).
camSmoothEnabled = false
camSmoothMinCutoffHz = 1.0
camSmoothBeta = 0.5
camSmoothDCutoffHz = 1.0
# Fill gap above this = adopt raw pose (freeze/thaw, menus). Keep well above
# the fill interval (fillEveryNFrames * frame time) or every step resets.
camSmoothResetMs = 250
camSmoothSnapDegrees = 30.0
camSmoothMaxLagDegrees = 2.0

# LENS PRIMING (v0.2.125): fill the lens once when the widget comes up (per
# equip), so the disc never sits black before the first aim. The primed
# picture is dimmed like a frozen one and shows no reticle (the reticle
# arrives with the sighted state - correct). poseIdleRefreshSeconds > 0
# re-fills the frozen lens every N seconds (one frame hitch per refresh;
# try 2.0 in the A/B session if the frozen picture reads too stale).
lensPrimeOnPresence = true
poseIdleRefreshSeconds = 0.0

# --- Pose-based activation (v0.2.116) ----------------------------------------
# Replace the vanilla eye-proximity gate's verdict with the plugin's own pose
# test. Vanilla activates only inside 38 units (~54 cm) of the eye, so a pistol
# scope at arm's length can NEVER activate. The pose test measures, per frame,
# against the ACTUAL scope tube (the measured ocular face + tube axis, nearest
# eye): eye distance, the eye's sideways offset from the tube axis line, and a
# head look cone. Each has an enter/exit pair (spatial hysteresis - no flicker
# hold needed). ON for field judgment; set false for v0.2.115 behavior.
poseGateEnabled = true
# Eye-to-ocular distance band, game units (1 unit ~ 1.43 cm). Enter under
# poseMaxDistance, drop only past poseExitDistance.
poseMaxDistance = 90.0
poseExitDistance = 100.0
# Sideways offset of the (nearest) eye from the tube axis, game units. This is
# the "could the eye be looking down the tube" test: 6 units is ~26 deg off-axis
# at a shouldered rifle and ~7 deg at arm's length - the cone scales with
# distance the way real optics do.
poseMaxLateral = 6.0
poseExitLateral = 9.0
# The head must be oriented at the scope: HMD-forward vs direction-to-ocular.
poseLookConeDegrees = 35.0
poseLookConeExitDegrees = 45.0
# true = the scope widget stays visible the whole time the weapon is drawn, with
# the lens FROZEN (last live picture, dimmed once) while the pose is inactive -
# no pop-in. false = the widget appears/disappears with the pose test.
poseWidgetAlways = true

# Never render the widget's own housing meshes (the pale speckled ring /
# bezel inside world_scope.nif) - the real weapon provides the housing; the
# widget only needs its render surfaces. v0.2.121: enforced three ways (the
# plugin's presence path no longer re-shows it, the engine's single show
# site is filtered, and the shapes are held at epsilon scale), so this is
# now a true never-render. Toggling false live restores the NIF scales.
hideWidgetHousing = true
# One-shot dim multiplier applied to the frozen picture (1.0 = no dim).
poseFrozenDim = 0.55

# Also suppress the eye-approach dimming fade (leave false for the vanilla feel).
# TRUE with the pose gate (2026-08-24): the vanilla fade ramps at the OLD
# activation distances (38-42 units) - now a meaningless dimming band on the way in.
disableApproachFade = true

# Black-burst hunt (v0.2.43): per-frame 1-pixel readback of accum+composite, dark
# frames logged. Two GPU sync stalls per render - turn OFF when not hunting.
diagLensReadback = false

# Burst forensics (v0.2.45): tint non-filled frames - RED = eye-gate pause,
# GREEN = cadence skip. A colored "burst" means the burst is a non-filled frame.
diagPauseTint = false

# Eye-gate OFF hysteresis (v0.2.50): swallow the gate blips that played the widget
# fade-to-black over the lens (the black bursts). 0 = vanilla behavior.
scopeOffHoldMs = 1500



# v0.2.72 — THE PERF FIX (VR-confirmed: our render 27.3 ms -> 13.6 ms, passes
# ~14,400 -> ~700 at Diamond City). Cull the scope render to its own frustum.
#
# The engine does NOT frustum-cull here: BSCuller::ProcessVectorFrustum is gated off
# whenever BSPreCulledObjects::QEnabled() is true, because Fallout 4 uses PREVIS --
# precomputed per-cell visibility, computed once per frame FOR THE PLAYER'S CAMERA.
# Our scope render inherited that whole visible set, so a 27x FOV change moved the
# workload 1.9% and a 300-unit far clip in Diamond City moved it 0.06%.
# This flips previs off across our accumulation only (keeping its occlusion, adding
# frustum culling). Set false to reproduce the old cost for a clean A/B; the sharp
# test is that `passes total=` should TRACK scopeFovDegrees (639 at 2.4deg,
# 5788 at 120deg) -- if it goes flat, culling has regressed.
cullToScopeFrustum = true

# --- v0.2.73 PERF: the stopwatch and its two levers -------------------------
# perfTimers times each stage of our render on BOTH timelines (GPU via D3D11
# timestamp queries, CPU via QPC) and reports the means on /state (stageTimes)
# and in the heartbeat. Flip it false then true to reset the averaging window --
# that is how you take a clean measurement without restarting anything.
perfTimers = true
# LEVER 1 -- render resolution. Scales the scope camera's viewport down to the
# top-left sub-rect of the fixed 1024^2 scope G-buffer (0.5 = 512x512 = quarter
# the pixels). The projection is NOT adjusted, so the lens shows the picture
# shrunk into a corner: WRONG PICTURE, RIGHT MEASUREMENT. It prices the whole
# G-buffer -> lighting -> composite chain at reduced resolution before any work
# is spent teaching the delivery to sample a sub-rect. 1.0 = untouched.
perfRenderScale = 1.0
# LEVER 2 -- light count. Caps the two light loops the deferred resolve iterates
# (385 shadowed + 15 queued at Diamond City) for the duration of the resolve
# only. 0 = no light volumes drawn at all, -1 = untouched. Through a 2.4 deg
# frustum any light that intersects projects across the whole target, so this
# prices the light overdraw in one reading.
perfLightsMax = -1

# ---------------------------------------------------------------------------
# THE SUN (v0.2.83) — VR-CONFIRMED 2026-08-09, screenshot 20260809161650.
#
# The lens now shows a genuinely sun-lit scene. Two defects had to be fixed:
#   v0.2.78  the exec ran BEFORE the resolve drew the G-buffer, so a deferred
#            directional light shaded the black clear and contributed exactly
#            zero (0x6a meanLum immovably 155.0, unmoved by a 10,000x sun).
#   v0.2.82  moved inside the resolve it then drew into the STILL-BOUND
#            G-buffer MRT, corrupting albedo/normals -> NaN in every downstream
#            buffer (black lens). Bind + COMMIT the accum MRT first.
#
# sunExecInResolve = false reverts to the old placement (no sun, no NaN).
sunExecEnabled = true
sunExecInResolve = true
sunResolveRebindAccum = true

# ---------------------------------------------------------------------------
# WIDGET FIT — fit the vanilla oversized render disc to the real scope lens.
#   ScopeParent.scale = aperture radius / 7.852  ->  1.267/7.852 = 0.1614
# VR-confirmed on the HUNTING RIFLE (user: "pretty damn close").
#
# ⚠️ aperture and scopeFovDegrees are COUPLED: M = theta_disc / theta_render,
# so shrinking the disc 6.2x divides the zoom by 6.2 unless scopeFovDegrees
# drops with it (15 -> 2.4). Never change one alone.
#
# v0.2.85: the aperture is now PER SCOPE. The plugin reads the node names out
# of the equipped weapon's 3D and looks the radius up (built-in table below,
# [Scopes] overrides it). widgetApertureRadius is only the fallback for a scope
# it does not recognise. Set perScopeAperture = false for the old behaviour of
# one radius for every optic.
widgetFitEnabled = true
perScopeAperture = true
widgetApertureRadius = 1.267
widgetScaleOverride = 0.0
# Fallback widget position for scopes with no per-scope entry below. The old
# -1.8 here was tuned for the hunting rifle and was visibly wrong on other
# optics (screenshots 20260810134759/...134809: the disc sat above and behind
# the scope), so it now lives in [Scopes.HuntingScope] where it belongs.
widgetOffsetX = 0.0
widgetOffsetY = 0.0
widgetOffsetZ = 0.0
widgetAutoPlace = true

# Staleness guard (v0.2.122): auto-placement refuses a target farther than this
# many units from the eye. Post-save-load probes carry pre-placement transforms
# (~350 units out) until the first skeleton update; a real equipped scope is
# never past ~60. The refusal makes the presence fit retry instead of latching
# a garbage position (the "no disc until I waved the gun around" defect).
widgetPlaceMaxEyeDist = 100.0

# ---------------------------------------------------------------------------
# PER-SCOPE APERTURE OVERRIDES
#
# Key = the scope's MODEL PATH (preferred) or a node name from the equipped
# weapon's 3D; value = the ocular lens radius in mesh units. Anything here wins
# over the plugin's built-in table.
#
# ** PREFER THE MODEL PATH FOR ANY MODDED SCOPE. ** Mod authors copy a vanilla
# scope mesh and keep its root node name, so several different optics can share
# one name -- a thermal scope that reports as "HuntingScope", a SCAR scope as
# "44MagScope". A node-name entry would retune the vanilla scope too, and you
# would have no way to tell them apart. The model path is unique per mesh.
#
# Paths are matched loosely so you can paste one from anywhere: case is ignored,
# / and \ are the same, a leading "Meshes\" is ignored, and a "_1" first-person
# suffix is folded away (the game loads HuntingRifleScope_1.nif for the mesh the
# game data calls HuntingRifleScope.nif -- both work).
#
# TO ADD A SCOPE: equip it, raise it, then look in TrueScopesVR.log for
#     SCOPE IDENT: no table entry. Add one under [Scopes] ... keyed by one of: ...
# and copy the quoted path it prints. Give it a radius: larger = bigger disc in
# the lens. Start near the radius of the hole you actually look through and
# nudge until the picture fills the tube without spilling past it.
#
# Also worth watching for in the log:
#     SCOPE IDENT: matched by NODE NAME while the mod list WAS readable
# That means the optic is almost certainly modded and is currently borrowing
# some vanilla scope's numbers -- exactly the case an entry here should fix.
#
# The built-in table covers the vanilla + DLC scopes (34 rows as of v0.2.112,
# measured at the rear rim of each optic and verified in VR where possible).
# If a scope's picture still spills slightly past the lens, trimming its
# radius here is the fix; slightly small reads as a sliver of bezel and is the
# easier direction to live with.
#
# THIS MUST BE THE LAST SECTION IN THE FILE — every key below a TOML section
# header belongs to that section, so anything added after it would silently
# stop being a TrueScopesVR setting.
# Short form  -- aperture only (quote a path; a bare node name needs no quotes):
#     "weapons/thermalscope/scopetherm1.nif" = 0.9
#     HuntingScope = 1.267
# Long form   -- aperture and/or position and/or screen aspect:
#     [Scopes."weapons/huntingrifle/huntingriflescope.nif"]
#     aperture = 1.267
#     offsetY  = -1.8
# An entry may set position ONLY; the built-in radius still applies. That is the
# common case for a scope whose size is fine but which sits off the lens.
#
# aspect (0.1 to 1.0) marks a RECTANGULAR screen optic: the aperture is then
# the screen's half-WIDTH and the picture is cropped vertically to height =
# aspect x width. The vanilla thermal MG scope ships aspect 0.538 built in;
# set it here for a modded optic whose display is wider than tall:
#     [Scopes."weapons/somegun/widescreen.nif"]
#     aperture = 1.3
#     aspect   = 0.55
[Scopes]

# VR-confirmed on the hunting rifle (user: "pretty damn close"). The aperture is
# the built-in 1.267 -- the one measured clear aperture in the whole table, since
# this is the only shipped scope with a distinct glass shape.
#
# Keyed by PATH as of v0.2.101, so it applies to the vanilla hunting rifle scope
# and to nothing else. Keyed by the node name "HuntingScope" it also applied to
# every modded optic that copied that mesh's root name.
#
# NOTE this offset only takes effect when widgetAutoPlace = false, or when
# automatic placement declines for this optic. Auto-placement (the default since
# v0.2.100) computes the position from the scope's own geometry. The entry is
# kept as the escape hatch and as the reference value auto-placement was
# checked against.
[Scopes."weapons/huntingrifle/huntingriflescope.nif"]
offsetY = -1.8

