# FO4VR True Scopes settings

[TrueScopesVR]
# Master switch for the lens fill.
fillEnabled = true

# Lens refresh cadence: 1 = every frame, 2 = every other frame, ...
# The lens render target persists between fills, so higher values just lower the
# refresh rate of the scope picture.
fillEveryNFrames = 1

# Force iScopeEnabled:VR to 2 (always-on) after game load. Required in phase 1:
# eye-gated show/hide needs the phase-1.5 enable-switch replacement.
forceAlwaysOn = true
